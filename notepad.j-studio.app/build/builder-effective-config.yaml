directories:
  output: build
  buildResources: build
productName: Notepad Jimhucksly Studio App
appId: com.example.notepad-jimhucksly-studioApp
copyright: 'Copyright © 2019 ${author}'
files:
  - filter:
      - '**/*'
      - dist/electron/**/*
dmg:
  contents:
    - x: 410
      'y': 150
      type: link
      path: /Applications
    - x: 130
      'y': 150
      type: file
mac:
  icon: build/icons/icon.icns
win:
  icon: static/icon.ico
  target:
    - nsis
squirrelWindows:
  iconUrl: 'https://raw.githubusercontent.com/matiastucci/electron-auto-updater-example/master/icons/icon.ico'
linux:
  icon: build/icons
electronVersion: 7.1.2
