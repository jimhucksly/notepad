services:
  database:
    container_name: notepad_app_db
    image: postgres:15.1-alpine
    environment:
      - POSTGRES_PASSWORD=cska
    ports:
     - 8001:5432
    volumes:
      - ./database/data:/var/lib/postgresql/data
      - ./database/scripts:/docker-entrypoint-initdb.d/
      - ./database/logs:/var/log/postgresql/
